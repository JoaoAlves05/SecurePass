<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecurePass confirmation</title><link rel="stylesheet" href="auth.css"></head>
<body>
  <main>
    <h1>SecurePass</h1>
    <p id="origin" class="origin">Secure confirmation</p>
    <p id="status" role="status" aria-live="polite"></p>
    <form id="unlockForm" hidden>
      <label for="passphrase">Master password</label>
      <input id="passphrase" type="password" autocomplete="current-password" maxlength="1024" required>
      <label id="confirmLabel" for="confirm" hidden>Confirm new master password (at least 12 characters)</label>
      <input id="confirm" type="password" autocomplete="new-password" maxlength="1024" hidden>
      <button id="unlock" type="submit">Unlock</button>
    </form>
    <button id="biometric" type="button" hidden>Unlock with authenticator</button>
    <section id="accounts" aria-label="Select account"></section>
    <button id="save" type="button" hidden>Confirm save or update</button>
    <button id="cancel" type="button">Cancel</button>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
